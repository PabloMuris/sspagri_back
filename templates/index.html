{% extends "base.html" %}
{% load static%}




{% block title %} Koltagri{% endblock title %}


{% block style %}
    <link rel="stylesheet" href="{% static 'css/index/index-layout.css' %}">
    <link rel="stylesheet" href="{% static 'css/index/index-decoration.css' %}">
    <link rel="stylesheet" href="{% static 'css/patterns/banner/banner-layout.css' %}">
    <link rel="stylesheet" href="{% static 'css/patterns/banner/banner-skin.css' %}">
    <link rel="stylesheet" href="{% static 'css/patterns/banner/index/index-banner-layout.css' %}">
    <link rel="stylesheet" href="{% static 'css/patterns/banner/index/index-banner-skin.css' %}">
    <style>

        .banner{
            background-image: url("{% static 'imgs/svg/home_page_.svg' %}");
        }
    </style>
{% endblock style %}



{% block main %}

               <p>Expandir</p>
               <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M200-200v-240h80v160h160v80H200Zm480-320v-160H520v-80h240v240h-80Z"/></svg>

        </div>

<section>
    teste
</section>
